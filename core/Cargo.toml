[package]
name = "mythics-logger-core"
description = "The mythics.gg logger's engine: finds, tails, splits, compresses and uploads World of Warcraft's combat log. No UI."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
base64 = "0.22"
# The archive's CRC check against the original (archive.rs). Exact versions:
# these touch the player's logs.
crc32fast = "=1.5.2"
# Only to give old logs' offset-less times this computer's UTC offset.
chrono = { version = "0.4", default-features = false, features = ["clock"] }
log = "0.4"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["time", "sync", "macros", "rt"] }
zstd = "0.13"
# Archiving finished logs (archive.rs): deflate only, through flate2's pure
# Rust backend; none of the crate's other formats or its encryption.
zip = { version = "=8.6.0", default-features = false, features = ["deflate-flate2"] }
# Only to pick the zip crate's deflate backend: miniz_oxide, pure Rust.
flate2 = { version = "=1.1.10", default-features = false, features = ["rust_backend"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
# Only to compress past logs on a background-priority thread (priority.rs).
windows-sys = { version = "0.59", features = ["Win32_System_Threading"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["time", "sync", "macros", "rt", "rt-multi-thread", "test-util"] }

[target.'cfg(windows)'.dev-dependencies]
# Only for examples/measure.rs, to read peak memory.
windows-sys = { version = "0.59", features = ["Win32_System_ProcessStatus", "Win32_System_Threading"] }
