[package]
name = "mythics-logger-core"
description = "The mythics.gg logger's engine: finds, tails, splits, compresses and uploads World of Warcraft's combat log. No UI."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
base64 = "0.22"
# Only to give old logs' offset-less times this computer's UTC offset.
chrono = { version = "0.4", default-features = false, features = ["clock"] }
log = "0.4"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["time", "sync", "macros", "rt"] }
zstd = "0.13"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
# Only to compress past logs on a background-priority thread (priority.rs).
windows-sys = { version = "0.59", features = ["Win32_System_Threading"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["time", "sync", "macros", "rt", "rt-multi-thread", "test-util"] }

[target.'cfg(windows)'.dev-dependencies]
# Only for examples/measure.rs, to read peak memory.
windows-sys = { version = "0.59", features = ["Win32_System_ProcessStatus", "Win32_System_Threading"] }
