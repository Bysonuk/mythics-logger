name: Build

# The mythics.gg Logger: Rust core and Tauri shell, and its Preact window.
# Every push and pull request builds and tests it on GitHub's own Windows
# runner. A `v*` tag also builds the release installer and attaches it,
# unsigned, to a draft release for a maintainer to publish. Signing
# (SignPath) joins the release job once the SignPath Foundation accepts the
# project: it signs only what this public workflow built.

# Every action is pinned to a full commit SHA (the version in the comment), so a
# moved tag can't change what builds a signed release.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  windows:
    name: Windows (build and test)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      # A release's tag must name the version the app reports, or the
      # installer and the app's About disagree.
      - name: Tag matches the app's version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          want="${GITHUB_REF_NAME#v}"
          for v in \
            "$(node -p "require('./src-tauri/tauri.conf.json').version")" \
            "$(node -p "require('./package.json').version")" \
            "$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)"; do
            if [ "$v" != "$want" ]; then
              echo "::error::Tag $GITHUB_REF_NAME, but a version file says $v"
              exit 1
            fi
          done

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch, 1 Oct 2026
        with:
          toolchain: stable
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - run: npm ci

      - name: "Window: types and tests"
        run: |
          npm run typecheck
          npm test

      - name: "Rust: format, lint, tests"
        run: |
          cargo fmt --all --check
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace

      # tauri's CLI reads CI as a boolean; GitHub sets it to "true" already.
      - name: Unsigned debug installer
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: npm run tauri build -- --debug

      # The release installer, and the updater's signature for it (a .sig
      # beside it, src-tauri/tauri.updater.conf.json). The signing key is
      # given to this step only, and only for a tag: a pull request never
      # sees it, and builds without the updater's files.
      - name: Release installer, with the updater's signature
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri build -- --config src-tauri/tauri.updater.conf.json

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        with:
          name: mythics-logger-unsigned-debug
          path: target/debug/bundle/nsis/*.exe
          retention-days: 7

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: mythics-logger-installer
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/nsis/*.exe.sig
          if-no-files-found: error
          retention-days: 30

  release:
    name: Draft release
    needs: windows
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Only this job may write: it makes the release, nothing else.
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: mythics-logger-installer
          path: dist

      # GitHub turns spaces in an asset's name into dots; doing it here keeps
      # the names in SHA256SUMS.txt and latest.json the same as the assets'.
      - name: Asset names
        working-directory: dist
        run: |
          for f in *; do
            if [ "$f" != "${f// /.}" ]; then mv -- "$f" "${f// /.}"; fi
          done
          ls -l
          [ "$(ls *.exe | wc -l)" = 1 ] && [ "$(ls *.exe.sig | wc -l)" = 1 ]

      - name: Checksums
        working-directory: dist
        run: sha256sum -- *.exe > SHA256SUMS.txt && cat SHA256SUMS.txt

      # A draft: a maintainer checks it, then publishes it by hand. Every
      # release's notes start with what changed since the previous release and
      # end with the code signing policy (SignPath
      # Foundation's terms ask for it on the download page).
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
          # The one switch for signing's wording: "true" once the SignPath
          # Foundation has accepted the project and this workflow signs the
          # installer. Until then the notes say the build is unsigned.
          SIGNED: "false"
        run: |
          policy="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY#code-signing-policy"
          if [ "$SIGNED" = "true" ]; then
            build="Signed build from $GITHUB_SHA by this repository's Build workflow (run $GITHUB_RUN_ID)."
            signing="Free code signing provided by [SignPath.io](https://about.signpath.io), certificate by [SignPath Foundation](https://signpath.org)."
          else
            build="Unsigned build from $GITHUB_SHA by this repository's Build workflow (run $GITHUB_RUN_ID). Windows SmartScreen warns before the first run until releases are signed."
            signing="This build is unsigned while the project's application to the SignPath Foundation is pending."
          fi
          # What changed since the previous release: every change reaches main
          # through a pull request (the ruleset), so GitHub's list of the
          # pull requests merged since the last release is the full trail.
          changes=$(gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes"             -f tag_name="$GITHUB_REF_NAME" --jq .body)
          {
            echo "$changes"
            echo
            echo "$build SHA-256 sums are in SHA256SUMS.txt."
            echo
            echo "### Code signing policy"
            echo
            echo "$signing See the [code signing policy]($policy), and [privacy]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY#privacy)."
          } > notes.md
          cat notes.md
          # The app's updater reads latest.json from the newest *published*
          # release (a draft is never "latest"): Tauri's static format, the
          # notes being what changed, the signature the installer's .sig.
          exe=$(cd dist && ls *.exe)
          jq -n \
            --arg version "${GITHUB_REF_NAME#v}" \
            --arg notes "$changes" \
            --arg pub_date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg signature "$(cat "dist/$exe.sig")" \
            --arg url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/$exe" \
            '{version: $version, notes: $notes, pub_date: $pub_date,
              platforms: {"windows-x86_64": {signature: $signature, url: $url}}}' \
            > dist/latest.json
          cat dist/latest.json
          gh release create "$GITHUB_REF_NAME" dist/*.exe dist/*.exe.sig dist/latest.json dist/SHA256SUMS.txt             --repo "$GITHUB_REPOSITORY"             --draft             --title "mythics.gg Logger $GITHUB_REF_NAME"             --notes-file notes.md
